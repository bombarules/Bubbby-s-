<style>
:root{
  --page:#3a3c42; --shell-hi:#e9eaec; --shell:#c8c9cc; --shell-lo:#8f9196;
  --face:#1d1e21; --face-edge:#3b3d43; --stripe-hi:#b3b5ba; --stripe-lo:#7f8187;
  --red:#d02a22; --red-hi:#ff6a52; --red-lo:#7d100c; --label:#d63a2c;
  --hud:#fbf6ea; --hud-dim:rgba(251,246,234,.6); --amber:#ffb43a;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#0e0f12; --shell-hi:#d4d5d8; --shell:#b3b4b8; --shell-lo:#76787e; }
}
:root[data-theme="dark"]{ --page:#0e0f12; --shell-hi:#d4d5d8; --shell:#b3b4b8; --shell-lo:#76787e; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;overflow:hidden;background:var(--page);touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{height:100%;display:flex;flex-direction:column;font-family:'Russo One',"Arial Black",system-ui,sans-serif;color:var(--hud)}

#game{position:relative;flex:1 1 50%;min-height:0;overflow:hidden;background:#000}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none}
.tl{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;gap:6px}
.hp{width:110px;height:10px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:5px;overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#e0452a,#ffb03a);transition:width .15s}
#score{font-size:15px;letter-spacing:.02em;text-shadow:0 1px 2px #000}
#wave{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:11px;line-height:1.35;text-align:center;white-space:pre-line;color:var(--hud-dim);text-shadow:0 1px 2px #000;max-width:40%}
#bossbar{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:42%;height:9px;border-radius:5px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);overflow:hidden;display:none}
#bossbar.on{display:block}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#8a5aff,#ff4ab0)}
#fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .4s;pointer-events:none}
#fade.on{opacity:1}
.br{position:absolute;right:12px;top:8px;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
#weap{display:flex;align-items:center;gap:6px;font-size:13px;text-shadow:0 1px 2px #000}
#weapIcon{font-size:22px;line-height:1;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.ammo{font-size:28px;line-height:1;text-shadow:0 2px 3px #000;margin-top:4px}
.ammo small{font-size:13px;color:var(--hud-dim);margin-left:3px}
.ammo.low{color:var(--amber)}
#magbar{display:flex;gap:3px;justify-content:flex-end;margin-top:5px}
#magbar i{width:7px;height:7px;background:var(--hud);border-radius:50%;box-shadow:0 1px 1px #000}
#magbar i.spent{background:rgba(255,255,255,.18)}
#reloadRing{width:24px;height:24px;margin-top:6px;opacity:0;transition:opacity .1s}
#reloadRing.on{opacity:1}
#xhair{position:absolute;left:50%;top:50%;width:0;height:0;--s:9px}
#xhair i{position:absolute;background:var(--hud);box-shadow:0 0 2px #000;border-radius:2px}
#xhair i:nth-child(1){width:2px;height:7px;left:-1px;top:calc(-1*var(--s) - 7px)}
#xhair i:nth-child(2){width:2px;height:7px;left:-1px;top:var(--s)}
#xhair i:nth-child(3){width:7px;height:2px;top:-1px;left:calc(-1*var(--s) - 7px)}
#xhair i:nth-child(4){width:7px;height:2px;top:-1px;left:var(--s)}
#xhair b{position:absolute;width:4px;height:4px;left:-2px;top:-2px;border-radius:50%;background:var(--hud)}
#hit{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0}
#hit::before,#hit::after{content:"";position:absolute;left:12px;top:0;width:2px;height:26px;background:#fff;box-shadow:0 0 3px #000}
#hit::before{transform:rotate(45deg)}#hit::after{transform:rotate(-45deg)}
#hit.kill::before,#hit.kill::after{background:#ffb43a}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(120,60,200,.75) 100%);opacity:0;transition:opacity .35s}
#msg{position:absolute;left:0;right:0;top:28%;text-align:center;font-size:21px;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .2s;padding:0 16px}
#msg.on{opacity:1}
#fsBtn{display:none!important;position:absolute;left:10px;bottom:10px;width:34px;height:34px;border-radius:8px;pointer-events:auto;z-index:5;
  display:grid;place-items:center;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);color:var(--hud)}
#fsBtn svg{width:18px;height:18px}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 20px 18px;text-align:center;
  background:linear-gradient(transparent 40%,rgba(0,0,0,.72))}
#overlay.hide{display:none}
#overlay h1{margin:0;font-weight:400;font-size:clamp(22px,6.5vw,36px);line-height:.9;color:#ff8a2a;
  text-shadow:0 3px 0 #6b1c05,0 6px 16px rgba(0,0,0,.8);transform:rotate(-3deg)}
#ovsub{margin:12px 0 4px;font-size:16px;animation:blink 1.1s steps(2) infinite}
#ovhint{margin:4px 0 0;font-family:system-ui,sans-serif;font-size:12px;line-height:1.45;color:var(--hud-dim);max-width:36ch}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#ovsub{animation:none}}

#pad{flex:1 1 50%;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 8px;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.07),transparent 70%)}
.shell{container-type:size;width:100%;height:100%;max-height:calc(100vw * .66);max-width:calc(50vh * 2.3);
  border-radius:16px;padding:3.2%;
  background:linear-gradient(180deg,var(--shell-hi),var(--shell) 28%,var(--shell) 70%,var(--shell-lo));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -5px 0 rgba(0,0,0,.22),0 14px 28px rgba(0,0,0,.5)}
.face{width:100%;height:100%;border-radius:9px;background:var(--face);
  display:grid;grid-template-columns:1.15fr .85fr 1.15fr;align-items:center;padding:3cqh 3cqw;
  box-shadow:inset 0 0 0 2px var(--face-edge),inset 0 4px 10px rgba(0,0,0,.85)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
.stick{position:relative;width:110px;width:min(34cqw,74cqh);aspect-ratio:1;border-radius:50%;touch-action:none;
  background:radial-gradient(circle at 50% 38%,#2b2c30,#131416 72%);
  box-shadow:0 0 0 3px #2b2c31,0 0 0 4px rgba(255,255,255,.08),inset 0 4px 10px rgba(0,0,0,.9)}
.stick::before{content:"";position:absolute;inset:13%;border-radius:50%;border:1px solid rgba(255,255,255,.06)}
.knob{position:absolute;z-index:1;left:24%;top:24%;width:52%;height:52%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 40% 30%,#5a5d65,#2b2d32 46%,#141518 78%);
  box-shadow:0 7px 12px rgba(0,0,0,.75),inset 0 2px 0 rgba(255,255,255,.2),inset 0 -4px 6px rgba(0,0,0,.6);
  transform:translate(var(--kx,0px),var(--ky,0px));transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
.knob::after{content:"";position:absolute;inset:17%;border-radius:50%;
  background:repeating-radial-gradient(circle,#2c2e33 0 2px,#1b1c20 2px 4px);box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.1)}
.stick.active .knob{transition:none}
.mid{gap:4.5cqh;justify-content:center;width:100%}
.stripe{width:100%;height:10px;height:min(7cqh,3.6cqw);border-radius:3px;background:linear-gradient(var(--stripe-hi),var(--stripe-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.lbls{display:flex;justify-content:space-around;width:100%;font-size:9px;font-size:min(3.6cqh,2.1cqw);color:var(--label);letter-spacing:.04em}
.well{width:100%;display:flex;justify-content:space-evenly;align-items:center;padding:9% 6%;border-radius:7px;
  background:linear-gradient(#d5d6d9,#a1a3a8);box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(0,0,0,.6)}
button{font:inherit;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.pill{position:relative;width:38%;height:18px;height:max(14px,8cqh);border-radius:999px;
  background:linear-gradient(#2c2d31,#121315);box-shadow:0 3px 0 #050506,inset 0 1px 0 rgba(255,255,255,.14)}
.pill::after{content:"";position:absolute;inset:-12px -6px}
.pill.on{transform:translateY(2px);box-shadow:0 1px 0 #050506}
.right{gap:3cqh}
.brand{align-self:flex-end;margin-right:4%;font-size:16px;font-size:min(8cqh,4.4cqw);color:var(--label);letter-spacing:.01em;white-space:nowrap}
.ab{display:flex;gap:4cqw;align-items:flex-start}
.btnwrap{display:flex;flex-direction:column;align-items:center;gap:1.6cqh}
.btnwrap span{font-size:11px;font-size:min(5cqh,2.8cqw);color:var(--label)}
.sq{width:56px;width:min(15.5cqw,44cqh);aspect-ratio:1;border-radius:13%;display:grid;place-items:center;
  background:linear-gradient(#dcdde0,#9c9ea3);box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(0,0,0,.65)}
.rb{position:relative;width:82%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,var(--red-hi),var(--red) 44%,var(--red-lo));
  box-shadow:0 4px 0 #560a08,inset 0 -3px 6px rgba(0,0,0,.3);transition:transform .04s}
.rb::after{content:"";position:absolute;inset:-14%;border-radius:50%}
.rb.on{transform:translateY(3px);box-shadow:0 1px 0 #560a08,inset 0 3px 6px rgba(0,0,0,.45)}

/* phone portrait: roomier controller layout */
@media (max-aspect-ratio: 2/3){
  #pad{padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
  .shell{max-height:calc(100vw * 1.02);max-width:none;padding:3%}
  .face{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"brand brand" "left right" "mid mid";
    padding:3.5cqh 5cqw 4cqh;row-gap:2cqh}
  .col.left{grid-area:left}
  .col.right{display:contents}
  .brand{grid-area:brand;justify-self:center;align-self:center;margin:0;font-size:min(7cqh,7cqw)}
  .ab{grid-area:right;justify-self:center;align-self:center;gap:6cqw}
  .ab .btnwrap:first-child{margin-top:7cqh}
  .sq{width:min(19cqw,23cqh)}
  .btnwrap span{font-size:min(4.4cqh,4cqw)}
  .stick{width:min(40cqw,46cqh)}
  .col.mid{grid-area:mid;gap:1.4cqh;width:auto}
  .mid .stripe{display:none}
  .lbls{width:min(56cqw,240px);font-size:min(3.6cqh,3.4cqw)}
  .well{width:min(56cqw,240px);padding:2.6cqh 5cqw}
  .pill{width:36%;height:max(16px,6cqh)}
}
/* ===== Bomba Arcade menu ===== */
#menu{position:fixed;inset:0;z-index:50;overflow:hidden;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:radial-gradient(circle at 78% 14%,#fff4dc 0 30px,rgba(255,226,180,.4) 32px,rgba(255,210,150,.1) 70px,transparent 120px),
    radial-gradient(ellipse at 50% 120%,#5a2a6e 0,transparent 60%),linear-gradient(#0d0b1c,#2a1d48 70%,#3a2456)}
#menu.hide{display:none}
#menu::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 32% 8%,#fff,transparent),radial-gradient(1px 1px at 52% 26%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 66% 40%,#fff,transparent),radial-gradient(1px 1px at 88% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 8% 46%,#fff,transparent),radial-gradient(1px 1px at 40% 52%,#fff,transparent)}
#mfloat img{position:absolute;left:0;top:var(--y);height:calc(64px * var(--s));opacity:.28;pointer-events:none;animation:mfl 18s linear infinite;animation-delay:calc(var(--d) * -1)}
@keyframes mfl{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
@media (prefers-reduced-motion:reduce){#mfloat img{animation:none;left:auto;right:6%}}
.mwrap{position:relative;z-index:1;width:min(100%,760px);display:flex;flex-direction:column;align-items:center;gap:18px}
.mlogo{margin:0 0 6px;font-weight:400;text-align:center;line-height:.95;font-size:clamp(38px,11vw,72px);color:#ff8a2a;transform:rotate(-3deg);
  text-shadow:0 4px 0 #6b1c05,0 9px 22px rgba(0,0,0,.7)}
.mlogo small{display:block;font-size:.42em;color:#7ee0d8;text-shadow:0 3px 0 #0e4a46,0 6px 14px rgba(0,0,0,.6);letter-spacing:.12em}
.mcards{display:grid;grid-template-columns:1fr;gap:14px;width:100%}
@media (min-aspect-ratio:1/1){.mcards{grid-template-columns:1fr 1fr}}
.mcard{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:20px;text-align:left;color:#fbf6ea;touch-action:manipulation;
  background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.18);
  box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .12s}
.mcard:active{transform:scale(.97)}
.mcard.shot{border-color:#ff9a3a}.mcard.boo{border-color:#7ee0d8}
.mart{flex:0 0 auto;width:96px;height:110px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.mart img{height:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.mart img.g{position:absolute;left:0;bottom:12px;height:78%}.mart img.c{position:absolute;right:-6px;bottom:0;height:52%}
.mtxt{display:flex;flex-direction:column;gap:5px;min-width:0}
.mtxt b{font-weight:400;font-size:24px;line-height:1}
.mcard.shot b{color:#ffb15a}.mcard.boo b{color:#8ef0e6}
.mtxt span{font-family:system-ui,sans-serif;font-size:14px;line-height:1.35;color:rgba(251,246,234,.78)}
.mtxt em{font-style:normal;font-size:13px;color:#ffd86a}
.mfoot{font-family:system-ui,sans-serif;font-size:12px;color:rgba(251,246,234,.5);text-align:center}
#ovMenu{pointer-events:auto;margin-top:10px;padding:7px 18px;border-radius:999px;font-size:14px;color:#fbf6ea;touch-action:manipulation;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.35)}

/* ===== Shot Bomba pause card (matches Boo Patrol) ===== */
#overlay.paused{justify-content:center;background:rgba(8,6,20,.78);padding-bottom:0}
#overlay.paused>h1,#overlay.paused>#ovsub,#overlay.paused>#ovhint,#overlay.paused>#ovMenu{display:none}
#ovPause{display:none;flex-direction:column;align-items:center;gap:6px;pointer-events:auto}
#overlay.paused #ovPause{display:flex}
#ovPause h2{margin:0;font-weight:400;font-size:clamp(34px,10vw,56px);color:#8ef0e6;transform:rotate(-3deg);text-shadow:0 4px 0 #0e4a46,0 8px 20px rgba(0,0,0,.7)}
#pzInfo{margin:8px 0 0;font-family:system-ui,sans-serif;font-size:14px;color:rgba(255,255,255,.75)}

/* ===== Boo Patrol ===== */
#bp{position:fixed;inset:0;z-index:40;display:none;background:#000;touch-action:none}
#bp.on{display:block}
#bpCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.bpTop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
#bpScore{font-size:24px;text-shadow:0 2px 3px #000;min-width:3ch}
#bpTurns{display:flex;gap:5px}
#bpTurns i{width:20px;height:18px;background:#ff5a6a;clip-path:path('M10 18 L1.5 9.5 A5 5 0 0 1 10 3 A5 5 0 0 1 18.5 9.5 Z');filter:drop-shadow(0 1px 1px #000)}
#bpTurns i.off{background:rgba(255,255,255,.2)}
#bpMiss{display:flex;gap:4px;align-items:center;font-family:system-ui,sans-serif;font-size:11px;color:rgba(255,255,255,.7)}
#bpMiss b{width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
#bpMiss b.on{background:#ff8a6a;border-color:#ff8a6a}
#bpRound{margin-left:auto;font-size:14px;color:#8ef0e6;text-shadow:0 1px 2px #000}
#bpPause{pointer-events:auto;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;touch-action:manipulation;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);color:#fbf6ea;font-size:15px}
#bpMsg{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:clamp(22px,6vw,34px);color:#fff6d8;pointer-events:none;
  text-shadow:0 3px 0 rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.8);opacity:0;transform:scale(.9);transition:opacity .2s,transform .2s;padding:0 16px}
#bpMsg.on{opacity:1;transform:scale(1)}
#bpOv{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 20px);background:rgba(8,6,20,.78)}
#bpOv.on{display:flex}
#bpOv h2{margin:0 0 4px;font-weight:400;font-size:clamp(34px,10vw,56px);color:#8ef0e6;transform:rotate(-3deg);text-shadow:0 4px 0 #0e4a46,0 8px 20px rgba(0,0,0,.7)}
.bpTag{margin:10px 0 2px;font-size:18px}.bpTag.ok{color:#ffd86a}.bpTag.no{color:#ff8a8a}
.roster{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px}
.roster figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.roster img{height:64px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.6))}
.roster figcaption{font-family:system-ui,sans-serif;font-size:11px;color:rgba(255,255,255,.75)}
.bpHint{margin:8px 0 0;max-width:40ch;font-family:system-ui,sans-serif;font-size:14px;line-height:1.45;color:rgba(255,255,255,.75)}
.bpBig{margin:0;font-size:52px;color:#ffd86a;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.bpBtns{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.bpBtns button{padding:12px 26px;border-radius:999px;font-size:18px;color:#fbf6ea;touch-action:manipulation;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35)}
.bpBtns button.pri{background:linear-gradient(#ffa03a,#e0601a);border-color:#ffc27a;box-shadow:0 4px 0 #7a2c08}
</style>

function collide(p,r){
  const lim=A-r-0.1;p.x=clamp(p.x,-lim,lim);p.z=clamp(p.z,-lim,lim);
  for(const c of colliders){
    const cx=clamp(p.x,c.x-c.hw,c.x+c.hw),cz=clamp(p.z,c.z-c.hd,c.z+c.hd);
    let dx=p.x-cx,dz=p.z-cz;const d2=dx*dx+dz*dz;
    if(d2<r*r){
      if(d2<1e-6){dx=p.x-c.x;dz=p.z-c.z;const L=Math.hypot(dx,dz)||1;dx/=L;dz/=L;p.x=c.x+dx*(c.hw+r);p.z=c.z+dz*(c.hd+r);}
      else{const d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r;}
    }
  }
}
function insideCollider(x,z,pad,y){return colliders.some(c=>(y===undefined||y<(c.h||99))&&Math.abs(x-c.x)<c.hw+pad&&Math.abs(z-c.z)<c.hd+pad);}

let AC=null,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}
}
function noise(dur,f0,f1,vol,type,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const n=AC.createBufferSource();n.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  n.connect(f);f.connect(g);g.connect(AC.destination);n.start(t);n.stop(t+dur+0.02);}
function tone(f0,f1,dur,vol,type,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);}

function placeCats(){const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
  cats.forEach(c=>{c.x=P.x+rx*c.slot[0]-fx*c.slot[1];c.z=P.z+rz*c.slot[0]-fz*c.slot[1];c.y=0;c.yaw=P.yaw;c.vel=0;c.pounceT=0;c.target=null;

function updateCats(dt){
  const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
  for(const c of cats){
    c.cd-=dt;
    if(c.target&&(c.target.dead||enemies.indexOf(c.target)<0))c.target=null;
    if(c.pounceT>0){
      c.pounceT-=dt;const p=1-c.pounceT/0.5;

      if(!c.struck&&p>0.6){c.struck=true;const e=c.target;
        if(e&&!e.dead&&Math.hypot(e.x-c.x,e.z-c.z)<1.0+0.6*e.sc){damageEnemy(e,1,1.2);spark(new THREE.Vector3(c.x,0.9,c.z),0xffe08a,0.9);}}

    }else{

        if(d<bd&&Math.hypot(e.x-P.x,e.z-P.z)<14){bd=d;best=e;}}
      c.target=best;
      let gx,gz,stop,maxV;
      if(best){gx=best.x;gz=best.z;stop=0.85+0.55*best.sc;maxV=6.8;
        if(bd<stop+0.35&&c.cd<=0){c.pounceT=0.5;c.struck=false;c.cd=1.7+Math.random()*0.7;
          const dx=best.x-c.x,dz=best.z-c.z,dd=Math.hypot(dx,dz)||1,jump=Math.max(0,dd-0.6*best.sc)/0.5;
          c.jvx=dx/dd*jump;c.jvz=dz/dd*jump;c.yaw=Math.atan2(-dx,-dz);sfx.meow(0.9+Math.random()*0.3);}
      }else{gx=P.x+rx*c.slot[0]-fx*c.slot[1];gz=P.z+rz*c.slot[0]-fz*c.slot[1];stop=0.25;maxV=8;}
      if(c.pounceT<=0){
        const dx=gx-c.x,dz=gz-c.z,d=Math.hypot(dx,dz)||1;

        else c.yaw=angDamp(c.yaw,best?Math.atan2(-(best.x-c.x),-(best.z-c.z)):P.yaw,4,dt);

    const px=c.x-P.x,pz=c.z-P.z,pd=Math.hypot(px,pz);if(pd<0.85&&pd>0.001){c.x+=px/pd*(0.85-pd);c.z+=pz/pd*(0.85-pd);}
    for(const o of cats){if(o===c)continue;const ox=c.x-o.x,oz=c.z-o.z,od=Math.hypot(ox,oz);if(od<0.6&&od>0.001){c.x+=ox/od*(0.6-od)*0.5;c.z+=oz/od*(0.6-od)*0.5;}}

    if(Math.hypot(c.x-P.x,c.z-P.z)>20){c.x=P.x-fx*1.5;c.z=P.z-fz*1.5;c.pounceT=0;c.y=0;}
  }
}
function animateCat(c,dt){

const ray=new THREE.Raycaster();ray.far=80;

  const hits=ray.intersectObjects(targets,false);
  let pt=null,en=null;
  if(hits.length){pt=hits[0].point.clone();en=hits[0].object.userData.enemy||null;}
  if(en)return new THREE.Vector3(en.x,1.1,en.z);
  const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);let best=null,bd=1e9;   // aim help for thumbs

  const F=FOOD[p.kind];const big=!!F.splash;

  if(F.splash){for(const e of enemies){if(e.dead)continue;const d=Math.hypot(e.x-pos.x,e.z-pos.z);if(d<F.splash)damageEnemy(e,d<1?F.dmg:F.dmg-1,0);}G.shake=Math.max(G.shake,0.08);}
  if(F.stick){sfx.goo();for(const e of enemies){if(!e.dead&&Math.hypot(e.x-pos.x,e.z-pos.z)<F.stickR*(e.boss?1.4:1))stickEnemy(e,F.stick*0.7);}
    if(pos.y<0.6)gooPuddles.push({x:pos.x,z:pos.z,life:5});}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i],F=FOOD[p.kind];
    p.life-=dt;if(p.life<=0){removeProjectile(p);continue;}
    let hit=false;
    for(let s=0;s<2&&!hit;s++){
      const h=dt/2;p.vel.y-=F.grav*h;p.mesh.position.addScaledVector(p.vel,h);
      const pos=p.mesh.position;
      for(const e of enemies){if(e.dead)continue;
        if(Math.hypot(e.x-pos.x,e.z-pos.z)<0.6*e.sc+F.size&&pos.y<1.9*e.sc&&pos.y>0){
          if(!F.splash)damageEnemy(e,F.dmg,F.slow);if(F.stick)stickEnemy(e,F.stick);impact(p,pos.clone());hit=true;break;}}
      if(hit)break;
      if(pos.y<F.size*0.6){pos.y=0.1;impact(p,pos.clone());hit=true;break;}
      if(Math.abs(pos.x)>A-0.1||Math.abs(pos.z)>A-0.1||insideCollider(pos.x,pos.z,0,pos.y)){impact(p,pos.clone());hit=true;break;}
    }
    if(!hit){p.mesh.rotation.x+=p.spin.x*dt;p.mesh.rotation.y+=p.spin.y*dt;p.mesh.rotation.z+=p.spin.z*dt;}
  }
}

const RING_COLORS={goo:0xcfe8ff,melon:0x6dff7a,pie:0xfff2c0,candy:0xffc21f,pumpkin:0xff8a1f};
function spawnPickup(){
  const kinds=['melon','pie','candy','goo'];
  const kind=kinds[Math.random()*kinds.length|0];
  let x=0,z=0,ok=false;
  for(let t=0;t<30&&!ok;t++){x=(Math.random()*2-1)*(A-4);z=(Math.random()*2-1)*(A-4);
    ok=!insideCollider(x,z,1.2)&&Math.hypot(x-P.x,z-P.z)>6&&pickups.every(p=>Math.hypot(p.x-x,p.z-z)>6);}
  if(!ok)return;
  const g=pivot(x,0,z,scene);
  const item=foodMesh(kind);item.scale.setScalar(kind==='candy'?3:1.9);item.position.y=1;g.add(item);
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.75,0.95,40),new THREE.MeshBasicMaterial({color:RING_COLORS[kind],transparent:true,opacity:0.8,blending:THREE.AdditiveBlending,depthWrite:false}));
  ring.rotation.x=-Math.PI/2;ring.position.y=0.04;g.add(ring);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:RING_COLORS[kind],blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.55}));
  glow.position.y=1;glow.scale.set(2.2,2.2,1);glow.material.color.multiplyScalar(2);g.add(glow);
  pickups.push({kind,g,item,ring,x,z,t:Math.random()*6,life:25});
}
function removePickup(p){scene.remove(p.g);const i=pickups.indexOf(p);if(i>=0)pickups.splice(i,1);}
function updatePickups(dt){
  G.pickupT-=dt;if(G.pickupT<=0){if(pickups.length<2)spawnPickup();G.pickupT=9+Math.random()*5;}
  for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];p.t+=dt;p.life-=dt;
    p.item.rotation.y+=dt*2.2;p.item.position.y=1+Math.sin(p.t*3)*0.15;p.ring.scale.setScalar(1+Math.sin(p.t*4)*0.08);
    if(p.life<4)p.g.visible=Math.sin(p.t*20)>0;
    if(p.life<=0){removePickup(p);continue;}
    if(Math.hypot(p.x-P.x,p.z-P.z)<1.3){equip(p.kind);sfx.pickup();buzz(20);showMsg('Got '+FOOD[p.kind].name.toLowerCase()+'!',1.4);
      spark(new THREE.Vector3(p.x,1,p.z),RING_COLORS[p.kind],2.5);removePickup(p);}

}

/* ================= hero animation ================= */
function animateHero(dt){
  const r=rig;
  const speed=Math.abs(P.vel);
  const turning=Math.abs(P.turn)>0.1&&speed<0.6;
  const stride=Math.max(clamp(speed/3,0,1),turning?0.32:0);
  P.phase+=dt*(P.vel<-0.1?-1:1)*(speed*1.9+(turning?5:0));
  const ph=P.phase,run=P.runAmt,aim=P.aimAmt,amp=stride*(0.6+0.4*run);
  P.stepAcc+=dt*(speed*1.9+(turning?5:0));if(P.stepAcc>Math.PI){P.stepAcc-=Math.PI;if(stride>0.2&&G.state==='play')sfx.step();}
  const bob=(0.5-0.5*Math.cos(2*ph))*0.1*amp;
  const breathe=Math.sin(G.time*2.3)*0.012*(1-stride);
  r.hips.position.y=0.78-0.07*run+bob+breathe;
  r.hips.rotation.y=Math.sin(ph)*0.14*amp;
  r.hips.rotation.z=Math.cos(ph)*0.06*amp;
  const tb=0.25*run,kb=-0.42*run;
  const legSet=(L,p)=>{
    L.hp.rotation.x=tb+Math.sin(p)*1.0*amp;
    L.kn.rotation.x=kb-amp*(0.15+1.3*Math.max(0,Math.cos(p))+0.3*Math.max(0,-Math.sin(p)));
    L.ft.rotation.x=-(L.hp.rotation.x+L.kn.rotation.x)*0.7;
  };
  legSet(r.legL,ph);legSet(r.legR,ph+Math.PI);
  r.torso.rotation.x=-0.36*run*(1-aim)+breathe*1.5;
  r.torso.rotation.y=-Math.sin(ph)*0.2*amp;
  r.torso.rotation.z=Math.sin(ph)*0.05*amp;
  r.head.rotation.x=0.3*run*(1-aim);
  r.head.rotation.y=-r.torso.rotation.y*0.7;
  r.head.rotation.z=Math.sin(ph)*0.07*amp+Math.sin(G.time*1.3)*0.03*(1-stride);
  r.tail.rotation.y=Math.sin(G.time*3)*0.3*(1-stride)+Math.sin(ph)*0.45*amp;
  r.tail.rotation.x=-0.15+0.35*run;
  // cartoon pumping arms (opposite the legs), blended into a throwing stance when aiming
  let lsx=-Math.sin(ph)*1.1*amp+0.25*run,lsz=0.18,lex=0.35+0.9*run;
  let rsx=Math.sin(ph)*0.5*amp+0.55,rsz=-0.18,rex=1.35;
  lsx=lerp(lsx,1.45,aim);lsz=lerp(lsz,0.12,aim);lex=lerp(lex,0.12,aim);
  rsx=lerp(rsx,-2.3,aim);rsz=lerp(rsz,-0.3,aim);rex=lerp(rex,1.5,aim);
  let heldVis=P.ammo>0;
  if(P.throwT>0){
    const p=1-P.throwT/THROW_T,e=1-Math.pow(1-p,3);
    rsx=lerp(-2.7,1.3,e);rex=lerp(1.7,0.15,e);rsz=-0.25;
    r.torso.rotation.y+=lerp(0.4,-0.35,e);lsx=lerp(1.45,0.3,e);
    heldVis=p>0.75&&P.ammo>0;
  }
  if(P.reloadAmt>0.01){
    lsx=lerp(lsx,-0.9,P.reloadAmt);lex=lerp(lex,1.1,P.reloadAmt);lsz=lerp(lsz,0.5,P.reloadAmt);
    r.head.rotation.y+=0.4*P.reloadAmt;
  }
  r.armL.sh.rotation.set(lsx,0,lsz);r.armL.el.rotation.x=lex;
  r.armR.sh.rotation.set(rsx,0,rsz);r.armR.el.rotation.x=rex;
  if(heldMesh){
    let s=heldMesh.userData.s;
    if(P.reloadT>0){const p=1-P.reloadT/P.reloadMax;s*=clamp((p-0.4)/0.5,0,1);heldVis=true;}
    heldMesh.visible=heldVis;heldMesh.scale.setScalar(s);
  }
  r.cape.rotation.x=damp(r.cape.rotation.x,-(0.1+P.runAmt*0.6+Math.max(0,P.vel)*0.03+Math.sin(G.time*5)*0.04*(0.3+P.runAmt)),8,dt);
  r.cape.rotation.z=Math.sin(G.time*3.1)*0.03*(0.4+P.runAmt);
  r.root.position.set(P.x,0,P.z);r.root.rotation.y=P.yaw;
}

function animateEnemy(e,dt){
  const r=e.r,st=e.stuckT>0;e.t+=dt*(st?0.15:e.slowT>0?0.5:1);
  r.body.position.y=0.25+Math.sin(e.t*3)*0.1;

  r.armL.rotation.z=0.3;r.armR.rotation.z=-0.3;
  r.mouth.scale.set(0.08,0.1+sw*0.08,0.04);

/* ================= update ================= */
function update(dt){
  const ax=clamp(stickVec.x+(input.right?1:0)-(input.left?1:0),-1,1);
  const fwd=clamp(-stickVec.y+(input.up?1:0)-(input.down?1:0),-1,1);
  const turnIn=-Math.sign(ax)*Math.pow(Math.abs(ax),1.4);
  P.turn=damp(P.turn,turnIn,14,dt);
  P.yaw+=P.turn*(P.aimT>0?1.9:2.5)*dt;
  const aiming=P.aimT>0||input.fire;
  const maxF=aiming?3.2:7,maxB=2.6;
  const target=fwd>0?fwd*maxF:fwd*maxB;
  P.vel=damp(P.vel,target,Math.abs(fwd)>0.05?6:10,dt);
  const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);
  const pos={x:P.x+fx*P.vel*dt,z:P.z+fz*P.vel*dt};collide(pos,0.55);P.x=pos.x;P.z=pos.z;
  P.runAmt=damp(P.runAmt,(P.vel>3.6&&!aiming)?1:0,7,dt);
  P.aimAmt=damp(P.aimAmt,aiming&&P.throwT<=0?1:aiming?P.aimAmt:0,14,dt);
  P.fireCD-=dt;P.aimT-=dt;P.throwT=Math.max(0,P.throwT-dt);
  if(P.reloadT>0){P.reloadT-=dt;P.reloadAmt=damp(P.reloadAmt,1,12,dt);
    if(P.reloadT<=0){const F=FOOD[P.weapon];const need=F.mag-P.ammo;const take=Math.min(need,P.reserve);P.ammo+=take;
      if(P.reserve!==Infinity)P.reserve-=take;P.reloadT=0;drawHud();}}
  else P.reloadAmt=damp(P.reloadAmt,0,12,dt);
  if(input.fire&&P.fireCD<=0&&P.reloadT<=0){
    if(P.ammo>0)throwFood();
    else if(!P.emptyLatch){P.emptyLatch=true;sfx.empty();if(!startReload())showMsg('Press A to grab more',1.2);}
  }
  if(!input.fire)P.emptyLatch=false;
  hud.ring.classList.toggle('on',P.reloadT>0);
  if(P.reloadT>0)hud.arc.setAttribute('stroke-dashoffset',(62.8*(P.reloadT/P.reloadMax)).toFixed(1));
  updateProjectiles(dt);updatePickups(dt);updateCats(dt);updateGoo(dt);
  if(G.transit){}
  else if(G.toSpawn>0){G.spawnT-=dt;if(G.spawnT<=0&&enemies.filter(e=>!e.dead).length<8){spawnEnemy();G.toSpawn--;G.spawnT=Math.max(0.5,1.4-G.wave*0.06);}}
  else if(G.bossPending){G.bossT-=dt;if(G.bossT<=0){G.bossPending=false;spawnEnemy(true);}}
  else if(enemies.length===0){
    const last=G.lw>=WAVES_PER_LEVEL,final=last&&G.level===LEVELS.length-1;
    if(G.between<=0){G.between=2.8;showMsg(final?'You beat the Ghost King!':last?LEVELS[G.level].name+' cleared!':'Wave cleared',2.4);if(last)sfx.pickup();}
    else{G.between-=dt;if(G.between<=0){
      if(final){setState('win');}
      else if(last){goLevel(G.level+1);}
      else{P.hp=Math.min(100,P.hp+25);nextWave();}}}
  }
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead){e.dead+=dt;const s=Math.max(0.001,1-e.dead*1.5)*e.sc;e.r.root.scale.setScalar(s);e.r.root.rotation.y+=dt*14;
      e.r.root.position.y=e.dead*2;if(e.dead>0.7)removeEnemy(e);continue;}
    const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz)||1;
    e.slowT-=dt;e.gooImm=(e.gooImm||0)-dt;const stuck=e.stuckT>0;if(stuck){e.stuckT-=dt;if(e.stuckT<=0)unstickEnemy(e);}
    if(!stuck&&d>e.reach&&e.atkT<=0){const sp=e.speed*(e.slowT>0?0.4:1)*dt;e.x+=dx/d*sp;e.z+=dz/d*sp;}
    for(const o of enemies){if(o===e||o.dead)continue;const ox=e.x-o.x,oz=e.z-o.z,od=Math.hypot(ox,oz);
      const md=0.55*(e.sc+o.sc);if(od<md&&od>0.001){e.x+=ox/od*(md-od)*0.5;e.z+=oz/od*(md-od)*0.5;}}
    const p={x:e.x,z:e.z};collide(p,0.5*e.sc);e.x=p.x;e.z=p.z;
    if(!stuck)e.yaw=Math.atan2(-dx,-dz);
    e.atkCD-=dt;e.flash-=dt;
    if(e.atkT>0){e.atkT-=dt;if(e.atkT<0.25&&!e.struck){e.struck=true;if(d<e.reach+0.6)hurtPlayer(e.boss?18:10);}}
    else if(!stuck&&d<e.reach+0.25&&e.atkCD<=0){e.atkT=0.5;e.atkCD=1.1;e.struck=false;sfx.boo();}
    e.r.root.position.set(e.x,0,e.z);e.r.root.rotation.y=e.yaw;
    animateEnemy(e,dt);
  }
}
function hurtPlayer(n){

/* ================= camera ================= */
const camPos=new THREE.Vector3(0,3,16),camLook=new THREE.Vector3();
function updateCamera(dt){
  if(G.state==='title'){
    G.titleA+=dt*0.3;const a=Math.PI+Math.sin(G.titleA)*0.9;
    const tx=P.x+Math.sin(a)*3.6,tz=P.z+Math.cos(a)*3.6;
    camPos.x=damp(camPos.x,tx,3,dt);camPos.y=damp(camPos.y,1.5,3,dt);camPos.z=damp(camPos.z,tz,3,dt);
    camera.position.copy(camPos);camera.lookAt(P.x,1.15,P.z);camera.fov=damp(camera.fov,50,3,dt);camera.updateProjectionMatrix();return;
  }
  const run=P.runAmt,aim=P.aimAmt,s=P.side;
  const ox=lerp(lerp(0.8,0.5,run),0.85,aim)*s;
  const oy=lerp(lerp(2.0,1.75,run),1.85,aim);
  const oz=lerp(lerp(3.7,4.4,run),2.7,aim);
  const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
  let tx=P.x+rx*ox-fx*oz,tz=P.z+rz*ox-fz*oz;
  const lim=A-0.4;tx=clamp(tx,-lim,lim);tz=clamp(tz,-lim,lim);
  const bob=Math.sin(P.phase*2)*0.04*run;
  camPos.x=damp(camPos.x,tx,14,dt);camPos.z=damp(camPos.z,tz,14,dt);camPos.y=damp(camPos.y,oy,10,dt);
  camera.position.set(camPos.x,camPos.y+bob,camPos.z);
  if(G.shake>0){camera.position.x+=(Math.random()-.5)*G.shake;camera.position.y+=(Math.random()-.5)*G.shake;G.shake=Math.max(0,G.shake-dt*0.9);}
  camLook.set(P.x+rx*ox*0.95+fx*14,1.35,P.z+rz*ox*0.95+fz*14);
  camera.lookAt(camLook);
  camera.rotateZ(Math.sin(P.phase)*0.012*run);
  camera.fov=damp(camera.fov,lerp(lerp(66,74,run),58,aim),8,dt);camera.updateProjectionMatrix();
}

/* ================= fx update ================= */
function updateFx(dt){
  for(const k of sparks){if(k.life<=0)continue;k.life-=dt;const t=k.life/k.max;k.s.scale.setScalar(k.size*(0.4+t));k.s.material.opacity=t;k.s.position.y+=k.vy*dt;if(k.life<=0)k.s.visible=false;}
  for(const c of chunks){if(c.life<=0)continue;c.life-=dt;c.v.y-=14*dt;c.m.position.addScaledVector(c.v,dt);
    if(c.m.position.y<0.03){c.m.position.y=0.03;c.v.set(0,0,0);}if(c.life<=0)c.m.visible=false;}
  for(const d of decals){if(d.life<=0)continue;d.life-=dt;if(d.life<1.5)d.m.material.opacity=0.9*d.life/1.5;if(d.life<=0)d.m.visible=false;}
  const cur=parseFloat(hud.x.style.getPropertyValue('--s'))||9;

}

  bh.ov.innerHTML='<h2>'+title+'</h2>'+body+'<div class="bpBtns">'+buttons.map(b=>'<button data-a="'+b[0]+'" class="'+(b[2]||'')+'">'+b[1]+'</button>').join('')+'</div>';
  bh.ov.classList.add('on');}
bh.ov.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;initAudio();const a=b.dataset.a;
  if(a==='go')bpNewGame();else if(a==='resume'){bh.ov.classList.remove('on');BP.state='play';}else if(a==='menu')showMenu();});
$('bpPause').addEventListener('click',()=>{if(BP.state==='play')bpPauseGame();else if(BP.state==='paused'){bh.ov.classList.remove('on');BP.state='play';}});
function bpIntro(){BP.state='intro';bpReset();
  bpOverlay('Boo Patrol',rosterHTML()+'<p class="bpHint">Ghosts pop out of windows, doors and fences as the town rolls by. Tap a friend and you lose a turn. Let 3 ghosts get away and you lose a turn too. Reach a new round to win back a heart.</p>',[['go','Start','pri'],['menu','Menu']]);}
function bpPauseGame(){BP.state='paused';bpOverlay('Paused','<p class="bpHint">Score '+BP.score.toLocaleString()+' \u00b7 Round '+BP.round+'</p>',[['resume','Keep going','pri'],['menu','Menu']]);}
function bpReset(){BP.score=0;BP.turns=3;BP.miss=0;BP.round=1;BP.ghosts=0;BP.scroll=-40;BP.pops=[];BP.fx=[];BP.spawnT=1.4;BP.shake=0;BP.flash=0;BP.blocks=[];bpSeed=7+((Math.random()*9999)|0);ensureWorld();bpHud();}
function bpNewGame(){bpReset();bh.ov.classList.remove('on');BP.state='play';bpMsg(THEMES[0].name,1.6);BP.blocks[0].announced=true;}
function bpGameOver(){BP.state='over';sfx&&bsfx.over();const nb=BP.score>(BEST.boo||0);arcadeScore('boo',BP.score);
  bpOverlay('Patrol over','<p class="bpBig">'+BP.score.toLocaleString()+'</p><p class="bpHint">'+(nb?'New best score!':'Best '+(BEST.boo||0).toLocaleString())+' \u00b7 Reached round '+BP.round+'</p>',[['go','Play again','pri'],['menu','Menu']]);}

/* difficulty by round */
const speed=()=>Math.min(170,58+14*(BP.round-1)),stayT=()=>Math.max(0.62,1.75-0.12*(BP.round-1)),
  gapT=()=>Math.max(0.42,1.25-0.09*(BP.round-1)),maxPops=()=>Math.min(5,2+Math.floor(BP.round/2)),
  friendP=()=>Math.min(0.36,0.2+0.03*BP.round);

function spawnPop(){
  const cand=[];
  for(const b of BP.blocks)for(const p of b.items)for(const s of p.spots){const sx=s.cx-BP.scroll;if(!s.busy&&s.cool<=0&&sx>VW*0.22&&sx<VW*0.9)cand.push(s);}
  if(!cand.length)return;
  const s=cand[(Math.random()*cand.length)|0];
  let kind='ghost',spr='ghost'+((Math.random()*4)|0),h=140,name='';
  const r=Math.random();
  if(r<friendP()){const f=FRIENDS[(Math.random()*FRIENDS.length)|0];kind='friend';spr=f.spr;h=f.h;name=f.name;}
  else if(BP.round>=2&&r<friendP()+0.06){kind='king';spr='king';h=176;}
  if(s.frac>=1)h*=1.05;
  s.busy=true;BP.pops.push({s,kind,spr,h,name,phase:'up',rise:0,t:0,stay:stayT()*(kind==='king'?0.8:1),wob:Math.random()*6});
  bsfx.pop();
}
function popGeom(p){const S=SPR[p.spr];const h=p.h,w=h*(S?S.ar:0.8);
  const bottom=p.s.base+h*(1-p.s.frac*p.rise);let x=p.s.cx-BP.scroll-w/2;
  if(p.phase==='oops')x+=Math.sin(BP.t*60)*6;
  return {x,y:bottom-h,w,h,bottom};}
function endPop(p){p.dead=true;p.s.busy=false;p.s.cool=1.2;}
function missGhost(p){BP.miss++;bsfx.miss();addFx('text',p.s.cx,p.s.base-40,{txt:'Got away!',col:'#ffb0b0'});
  if(BP.miss>=3)loseTurn('3 ghosts got away!');else bpHud();}
function loseTurn(msg){BP.turns--;BP.miss=0;BP.flash=1;BP.shake=0.35;bpHud();
  if(BP.turns<=0){bpMsg(msg,1.6);BP.state='ending';BP.overT=1.6;}
  else bpMsg(msg+' '+(BP.turns===1?'Last turn!':BP.turns+' turns left'),1.8);}
function addFx(type,wx,wy,o){BP.fx.push(Object.assign({type,wx,wy,t:0},o||{}));}

function bpTap(e){
  if(BP.state!=='play')return;initAudio();
  const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/SC,py=(e.clientY-r.top)/SC;
  bsfx.bang();addFx('ring',px+BP.scroll,py);
  for(let i=BP.pops.length-1;i>=0;i--){const p=BP.pops[i];if(p.dead||p.phase==='hit'||p.phase==='oops'||p.rise<0.35)continue;
    const c=p.s.clip,sx=c.x-BP.scroll;if(px<sx||px>sx+c.w||py<c.y||py>c.y+c.h)continue;
    const g=popGeom(p);if(px<g.x+g.w*0.1||px>g.x+g.w*0.9||py<g.y+g.h*0.04||py>g.bottom)continue;
    if(p.kind==='friend'){p.phase='oops';p.t=0.9;bsfx.oops();addFx('x',p.s.cx,g.y+g.h*0.4);loseTurn('Oops! That\u2019s '+p.name+'!');}
    else{p.phase='hit';p.t=0;bsfx.poof();
      const pts=(p.kind==='king'?500:100)*BP.round;BP.score+=pts;BP.ghosts++;
      addFx('poof',p.s.cx,g.y+g.h*0.45,{col:p.kind==='king'?'#ffd84a':'#ffffff'});
      addFx('text',p.s.cx,g.y,{txt:'+'+pts,col:p.kind==='king'?'#ffd84a':'#fff6d8'});
      if(BP.ghosts%12===0){BP.round++;bsfx.round();
        if(BP.turns<3){BP.turns++;bpMsg('Round '+BP.round+'! +1 heart \u2764',1.8);addFx('heart',BP.scroll+VW/2,VH*0.36);}
        else bpMsg('Round '+BP.round+' \u2014 faster!',1.6);}
      bpHud();}
    return;}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();bpTap(e);});

function bpUpdate(dt){
  BP.t+=dt;BP.shake=Math.max(0,BP.shake-dt);BP.flash=Math.max(0,BP.flash-dt*2.2);
  BP.fx.forEach(f=>f.t+=dt);BP.fx=BP.fx.filter(f=>f.t<(f.type==='text'||f.type==='heart'?0.9:0.5));
  if(BP.state==='ending'){BP.overT-=dt;if(BP.overT<=0)bpGameOver();}
  if(BP.state!=='play'&&BP.state!=='ending')return;
  BP.scroll+=speed()*dt*(BP.state==='ending'?0.3:1);ensureWorld();
  for(const b of BP.blocks){if(!b.announced&&b.x0+80<BP.scroll+VW*0.55){b.announced=true;if(BP.state==='play')bpMsg(THEMES[b.ti].name,1.5);}
    for(const p of b.items)for(const s of p.spots)s.cool-=dt;}
  if(BP.state==='play'){BP.spawnT-=dt;
    if(BP.spawnT<=0){BP.spawnT=gapT()*(0.7+Math.random()*0.6);if(BP.pops.filter(p=>!p.dead).length<maxPops())spawnPop();}}
  for(const p of BP.pops){if(p.dead)continue;
    if(p.phase==='up'){p.rise=Math.min(1,p.rise+dt/0.16);if(p.rise>=1){p.phase='stay';p.t=0;}}
    else if(p.phase==='stay'){p.t+=dt;if(p.t>=p.stay)p.phase='down';}
    else if(p.phase==='down'){p.rise-=dt/0.2;if(p.rise<=0){endPop(p);if(p.kind!=='friend'&&BP.state==='play')missGhost(p);}}
    else if(p.phase==='hit'){p.t+=dt;p.rise=Math.max(0,p.rise-dt*3);if(p.t>0.32)endPop(p);}
    else if(p.phase==='oops'){p.t-=dt;if(p.t<=0)p.phase='down';}
    if(!p.dead&&p.s.cx-BP.scroll<-120){endPop(p);if(p.kind!=='friend'&&p.phase!=='hit'&&BP.state==='play')missGhost(p);}
  }
  BP.pops=BP.pops.filter(p=>!p.dead);
}

/* drawing */
const c=cx2;
function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawSky(){
  for(const b of BP.blocks){const a=Math.max(0,b.x0-BP.scroll),z=Math.min(VW,b.x1-BP.scroll);if(z<=a)continue;const T=THEMES[b.ti];
    const gr=c.createLinearGradient(0,0,0,GY);gr.addColorStop(0,T.sky[0]);gr.addColorStop(1,T.sky[1]);c.fillStyle=gr;c.fillRect(a,0,z-a+1,GY+2);
    // stars
    c.fillStyle='rgba(255,255,255,.7)';for(let k=Math.floor((BP.scroll*0.1+a)/37);k<(BP.scroll*0.1+z)/37;k++){const sx=k*37-BP.scroll*0.1,sy=hash(k)*GY*0.45;if(sx>=a&&sx<=z)c.fillRect(sx,sy,1.6,1.6);}
    // moon (one per block, slow parallax)
    const mx=b.x0+VW*0.7-BP.scroll*0.06-(b.x0-BP.scroll)*0.94;const my=GY*0.18+20;
    if(mx>a-60&&mx<z+60){c.save();c.beginPath();c.rect(a,0,z-a,GY);c.clip();c.fillStyle=T.moon;c.shadowColor=T.moon;c.shadowBlur=30;c.beginPath();c.arc(mx,my,34,0,7);c.fill();c.restore();}
  }
  // far silhouettes
  const par=0.35,cell=60;const k0=Math.floor((BP.scroll*par)/cell)-1,k1=k0+Math.ceil(VW/cell)+3;
  for(let k=k0;k<k1;k++){const sx=k*cell-BP.scroll*par;const b=blockAt(BP.scroll+sx+cell/2);const T=THEMES[b.ti];c.fillStyle=T.far;const hh=hash(k);
    const top=GY-130-hh*140;
    if(T.farKind==='roofs'){c.fillRect(sx,top,cell+1,GY-top);if(hh>0.6){c.fillRect(sx+12,top-30,10,30);}c.fillStyle='rgba(255,200,120,.25)';if(hh>0.3)c.fillRect(sx+20,top+30,10,12);}
    else if(T.farKind==='hills'){c.beginPath();c.moveTo(sx,GY);c.lineTo(sx,GY-110-hash(k)*70);c.quadraticCurveTo(sx+cell/2,GY-150-hh*80,sx+cell+1,GY-110-hash(k+1)*70);c.lineTo(sx+cell+1,GY);c.fill();}
    else if(T.farKind==='crosses'){c.fillRect(sx,GY-90,cell+1,90);if(hh>0.45){c.fillRect(sx+26,GY-150-hh*30,7,70);c.fillRect(sx+16,GY-130-hh*30,27,7);}}
    else if(T.farKind==='candy'){c.beginPath();c.arc(sx+cell/2,GY-60,40+hh*40,Math.PI,0);c.fill();c.fillRect(sx,GY-60,cell+1,60);if(hh>0.55){c.fillRect(sx+cell/2-3,GY-200,6,120);c.beginPath();c.arc(sx+cell/2,GY-205,22,0,7);c.fill();}}
    else{c.fillRect(sx,GY-120-hh*50,cell+1,200);if(hh>0.5){c.fillRect(sx+14,GY-230-hh*60,32,140);c.beginPath();c.moveTo(sx+10,GY-230-hh*60);c.lineTo(sx+30,GY-280-hh*60);c.lineTo(sx+50,GY-230-hh*60);c.fill();}}
  }
}
function drawGround(){
  for(const b of BP.blocks){const a=Math.max(0,b.x0-BP.scroll),z=Math.min(VW,b.x1-BP.scroll);if(z<=a)continue;const T=THEMES[b.ti];
    c.fillStyle=T.ground;c.fillRect(a,GY,z-a+1,VH-GY);c.fillStyle=T.edge;c.fillRect(a,GY,z-a+1,6);
    c.fillStyle='rgba(0,0,0,.18)';for(let k=Math.floor((BP.scroll+a)/90);k*90-BP.scroll<z;k++)c.fillRect(k*90-BP.scroll,GY+26,46,5);}
}
function bricks(x,y,w,h,col){c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.strokeStyle=col;c.lineWidth=2;c.beginPath();
  for(let r=0,yy=y;yy<y+h;r++,yy+=22){c.moveTo(x,yy);c.lineTo(x+w,yy);for(let xx=x+(r%2?22:0);xx<x+w;xx+=44){c.moveTo(xx,yy);c.lineTo(xx,yy+22);}}c.stroke();c.restore();}
function windowBack(sx,top,T){const gr=c.createLinearGradient(0,top,0,top+120);gr.addColorStop(0,'#1a1220');gr.addColorStop(1,T.glow);c.globalAlpha=1;
  c.fillStyle='#120c18';c.fillRect(sx-50,top,100,120);c.globalAlpha=0.35;c.fillStyle=gr;c.fillRect(sx-50,top,100,120);c.globalAlpha=1;}
function windowFront(sx,top,T){c.strokeStyle=T.frame;c.lineWidth=8;c.strokeRect(sx-50,top,100,120);c.fillStyle=T.frame;c.fillRect(sx-60,top+118,120,10);
  if(T.bstyle==='castle'){c.fillStyle=T.wall;c.beginPath();c.moveTo(sx-54,top-4);c.lineTo(sx-54,top+34);c.quadraticCurveTo(sx-54,top-4,sx,top-4);c.quadraticCurveTo(sx+54,top-4,sx+54,top+34);c.lineTo(sx+54,top-4);c.fill();
    c.strokeStyle=T.frame;c.lineWidth=6;c.beginPath();c.moveTo(sx-50,top+34);c.quadraticCurveTo(sx-50,top,sx,top);c.quadraticCurveTo(sx+50,top,sx+50,top+34);c.stroke();}
  if(T.bstyle==='candy'){c.fillStyle='#8ae0ff';c.fillRect(sx-62,top-8,124,10);}
  if(T.bstyle==='barn'){c.strokeStyle=T.frame;c.lineWidth=4;c.beginPath();c.moveTo(sx-50,top);c.lineTo(sx-30,top+20);c.moveTo(sx+50,top);c.lineTo(sx+30,top+20);c.stroke();}}
function drawProp(p,T,layer){
  const sx=p.x-BP.scroll;if(sx>VW+40||sx+p.w<-40)return;const g=GY;
  switch(p.type){
  case 'building':{const top=g-440;
    if(layer==='back'){c.fillStyle=T.wall;
      if(T.bstyle==='candy'){c.fillRect(sx,top+20,330,440-20);bricks(sx,top+20,330,420,T.brick);c.fillStyle='#ff5fa8';c.beginPath();c.moveTo(sx-16,top+24);c.lineTo(sx+165,top-70);c.lineTo(sx+346,top+24);c.fill();
        c.fillStyle='#fff';for(let i=0;i<9;i++){c.beginPath();c.arc(sx-6+i*42,top+24,14,0,Math.PI);c.fill();}}
      else if(T.bstyle==='barn'){c.fillRect(sx,top+30,330,410);c.fillStyle='#6a3a20';c.beginPath();c.moveTo(sx-14,top+34);c.lineTo(sx+40,top-30);c.lineTo(sx+290,top-30);c.lineTo(sx+344,top+34);c.fill();
        c.strokeStyle=T.brick;c.lineWidth=3;c.beginPath();for(let xx=sx+30;xx<sx+330;xx+=30){c.moveTo(xx,top+30);c.lineTo(xx,g);}c.stroke();}
      else if(T.bstyle==='crypt'){c.fillRect(sx+10,top+40,310,400);bricks(sx+10,top+40,310,400,T.brick);c.fillStyle='#3e4844';c.beginPath();c.moveTo(sx-4,top+44);c.lineTo(sx+165,top-30);c.lineTo(sx+334,top+44);c.fill();}
      else{c.fillRect(sx,top,330,440);bricks(sx,top,330,440,T.brick);
        if(T.bstyle==='castle'){for(let i=0;i<6;i++)c.fillRect(sx+i*60,top-30,36,32);}
        else{c.fillStyle='#2b2236';c.fillRect(sx-8,top-10,346,16);}}
      for(const s of p.spots)windowBack(s.cx-BP.scroll,s.clip.y,T);}
    else for(const s of p.spots)windowFront(s.cx-BP.scroll,s.clip.y,T);
    break;}
  case 'fence':{if(layer==='back')break;const top=g-140;
    if(T.fstyle==='wood'){c.fillStyle='#b07a44';for(let xx=sx;xx<sx+300;xx+=30){c.beginPath();c.moveTo(xx+2,g);c.lineTo(xx+2,top+10);c.lineTo(xx+14,top-4);c.lineTo(xx+26,top+10);c.lineTo(xx+26,g);c.fill();}
      c.fillStyle='#8a5a30';c.fillRect(sx,top+30,300,14);c.fillRect(sx,top+90,300,14);}
    else if(T.fstyle==='candy'){for(let xx=sx;xx<sx+300;xx+=30){c.fillStyle='#fff';c.fillRect(xx+4,top,20,140);c.fillStyle='#ff3a6a';for(let yy=top;yy<g;yy+=24){c.beginPath();c.moveTo(xx+4,yy+8);c.lineTo(xx+24,yy);c.lineTo(xx+24,yy+10);c.lineTo(xx+4,yy+18);c.fill();}}
      c.fillStyle='#8ae0ff';c.fillRect(sx,top+40,300,12);}
    else if(T.fstyle==='stone'){c.fillStyle=T.wall;c.fillRect(sx,top,300,140);bricks(sx,top,300,140,T.brick);c.fillStyle=T.frame;c.fillRect(sx-6,top-10,312,14);}
    else{c.fillStyle='#4a4660';c.fillRect(sx,top,300,140);c.strokeStyle='#6a6488';c.lineWidth=3;c.beginPath();for(let xx=sx;xx<sx+300;xx+=20){c.moveTo(xx,top);c.lineTo(xx+20,top+140);c.moveTo(xx+20,top);c.lineTo(xx,top+140);}c.stroke();
      c.fillStyle='#ffc23a';c.fillRect(sx,top-8,300,10);c.fillStyle='#222';for(let xx=sx;xx<sx+300;xx+=30)c.fillRect(xx,top-8,15,10);}
    break;}
  case 'crates':{if(layer==='back')break;
    const crate=(x,y)=>{if(T.cstyle==='hay'){c.fillStyle='#e0b44a';rr(x,y,100,100,10);c.fill();c.strokeStyle='#b88a2a';c.lineWidth=3;c.beginPath();for(let i=1;i<5;i++){c.moveTo(x+6,y+i*20);c.lineTo(x+94,y+i*20);}c.stroke();c.fillStyle='#c0452a';c.fillRect(x+20,y,8,100);c.fillRect(x+72,y,8,100);}
      else{c.fillStyle='#9a6a3a';c.fillRect(x,y,100,100);c.strokeStyle='#6a4422';c.lineWidth=6;c.strokeRect(x+3,y+3,94,94);c.beginPath();c.moveTo(x+6,y+6);c.lineTo(x+94,y+94);c.stroke();}};
    crate(sx+2,g-100);crate(sx+108,g-100);crate(sx+55,g-200);break;}
  case 'tomb':{if(layer==='back')break;c.fillStyle='#8a948e';c.beginPath();c.moveTo(sx+20,g);c.lineTo(sx+20,g-100);c.arc(sx+75,g-100,55,Math.PI,0);c.lineTo(sx+130,g);c.fill();
    c.strokeStyle='#5e6862';c.lineWidth=4;c.stroke();c.fillStyle='#5e6862';c.font='bold 26px "Russo One",sans-serif';c.textAlign='center';c.fillText('RIP',sx+75,g-80);
    c.fillStyle='#2e3a32';c.fillRect(sx+6,g-12,138,12);break;}
  case 'pumpkin':{if(layer==='back')break;const px=sx+100,py=g-62;c.fillStyle='#e8701c';

    c.fillStyle='#4a6a1a';c.fillRect(px-7,py-74,14,22);c.fillStyle='#ffd23a';c.beginPath();c.moveTo(px-34,py-10);c.lineTo(px-18,py-30);c.lineTo(px-6,py-10);c.fill();
    c.beginPath();c.moveTo(px+34,py-10);c.lineTo(px+18,py-30);c.lineTo(px+6,py-10);c.fill();c.beginPath();c.moveTo(px-36,py+12);c.quadraticCurveTo(px,py+44,px+36,py+12);c.quadraticCurveTo(px,py+26,px-36,py+12);c.fill();break;}
  case 'door':{const top=g-270;
    if(layer==='back'){c.fillStyle=T.wall;c.fillRect(sx,top,170,270);if(T.bstyle!=='barn')bricks(sx,top,170,270,T.brick);c.fillStyle='#0c0810';c.fillRect(sx+30,g-220,110,220);
      const gr=c.createLinearGradient(0,g-220,0,g);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,T.glow);c.globalAlpha=0.3;c.fillStyle=gr;c.fillRect(sx+30,g-220,110,220);c.globalAlpha=1;
      if(T.bstyle==='crypt'||T.bstyle==='castle'){c.fillStyle=T.brick;c.beginPath();c.moveTo(sx-10,top+4);c.lineTo(sx+85,top-50);c.lineTo(sx+180,top+4);c.fill();}}
    else{c.strokeStyle=T.frame;c.lineWidth=8;c.strokeRect(sx+30,g-220,110,224);c.fillStyle=T.bstyle==='ware'?'#6a6488':'#7a4a28';c.save();c.translate(sx+30,g-220);c.transform(0.35,0.12,0,1,0,0);c.fillRect(-110,0,110,220);c.restore();}

  case 'lamp':{if(layer==='back')break;c.fillStyle='#2a2832';c.fillRect(sx+30,g-260,10,260);c.fillRect(sx+18,g-268,34,14);c.save();c.fillStyle=T.glow;c.shadowColor=T.glow;c.shadowBlur=26;c.beginPath();c.arc(sx+35,g-244,12,0,7);c.fill();c.restore();break;}
  case 'tree':{if(layer==='back')break;c.strokeStyle='#1c1418';c.lineCap='round';const tr=(x,y,a,l,w)=>{if(l<14)return;const x2=x+Math.cos(a)*l,y2=y+Math.sin(a)*l;c.lineWidth=w;c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke();tr(x2,y2,a-0.45,l*0.68,w*0.65);tr(x2,y2,a+0.5,l*0.62,w*0.65);};
    tr(sx+75,g,-Math.PI/2,110,16);break;}
  case 'lolli':{if(layer==='back')break;c.fillStyle='#fff';c.fillRect(sx+41,g-230,8,230);const cols=['#ff5fa8','#8ae0ff','#fff2a0'];for(let i=3;i>0;i--){c.fillStyle=cols[i%3];c.beginPath();c.arc(sx+45,g-250,i*14,0,7);c.fill();}break;}
  case 'scare':{if(layer==='back')break;c.fillStyle='#7a5a30';c.fillRect(sx+50,g-230,10,230);c.fillRect(sx+10,g-180,90,9);c.fillStyle='#6a4a8a';c.fillRect(sx+30,g-185,50,70);
    c.fillStyle='#e8c48a';c.beginPath();c.arc(sx+55,g-205,22,0,7);c.fill();c.fillStyle='#4a3020';c.beginPath();c.moveTo(sx+20,g-215);c.lineTo(sx+90,g-215);c.lineTo(sx+55,g-260);c.fill();break;}
  case 'sign':{if(layer==='back')break;c.fillStyle='#3a2a20';c.fillRect(sx+70,g-170,10,170);c.fillStyle=T.frame;rr(sx+4,g-200,142,60,8);c.fill();c.strokeStyle='#2a1a14';c.lineWidth=4;c.stroke();
    c.fillStyle='#2a1a14';c.font='15px "Russo One",sans-serif';c.textAlign='center';const w=T.name.split(' ');c.fillText(w[0],sx+75,g-174);if(w[1])c.fillText(w.slice(1).join(' '),sx+75,g-154);break;}
  }
}
function drawPops(){
  for(const p of BP.pops){if(p.dead||p.rise<=0.001)continue;const S=SPR[p.spr];if(!S)continue;const cl=p.s.clip,g=popGeom(p);
    c.save();c.beginPath();c.rect(cl.x-BP.scroll,cl.y,cl.w,cl.h);c.clip();
    if(p.phase==='hit'){const k=p.t/0.32;c.globalAlpha=1-k;const sc=1+k*0.35;c.translate(g.x+g.w/2,g.y+g.h/2);c.scale(sc,sc);c.drawImage(S.img,-g.w/2,-g.h/2,g.w,g.h);}
    else{const bob=p.phase==='stay'?Math.sin(BP.t*5+p.wob)*3:0;c.drawImage(S.img,g.x,g.y+bob,g.w,g.h);}
    c.restore();}
}
function drawFx(){
  for(const f of BP.fx){const x=f.wx-BP.scroll,y=f.wy;
    if(f.type==='ring'){const k=f.t/0.5;c.strokeStyle='rgba(255,240,200,'+(1-k)+')';c.lineWidth=4;c.beginPath();c.arc(x,y,8+k*30,0,7);c.stroke();
      if(f.t<0.08){c.fillStyle='rgba(255,255,220,.9)';c.beginPath();c.arc(x,y,12,0,7);c.fill();}}
    else if(f.type==='poof'){const k=f.t/0.5;c.fillStyle=f.col;c.globalAlpha=1-k;for(let i=0;i<10;i++){const a=i/10*6.283;c.beginPath();c.arc(x+Math.cos(a)*(20+k*70),y+Math.sin(a)*(20+k*70),10*(1-k)+3,0,7);c.fill();}
      c.globalAlpha=1;}
    else if(f.type==='text'){const k=f.t/0.9;c.globalAlpha=1-k*k;c.fillStyle=f.col;c.strokeStyle='rgba(0,0,0,.7)';c.lineWidth=5;c.font='28px "Russo One",sans-serif';c.textAlign='center';
      c.strokeText(f.txt,x,y-k*50);c.fillText(f.txt,x,y-k*50);c.globalAlpha=1;}
    else if(f.type==='heart'){const k=f.t/0.9,sz=34+k*26;c.globalAlpha=1-k*k;c.fillStyle='#ff5a6a';c.strokeStyle='rgba(0,0,0,.6)';c.lineWidth=4;
      c.save();c.translate(x,y-k*60);c.scale(sz/20,sz/20);c.beginPath();c.moveTo(0,7);c.bezierCurveTo(-10,0,-9,-9,-4.5,-9);c.bezierCurveTo(-2,-9,0,-7,0,-5);c.bezierCurveTo(0,-7,2,-9,4.5,-9);c.bezierCurveTo(9,-9,10,0,0,7);c.closePath();c.restore();c.stroke();c.fill();c.globalAlpha=1;}
    else if(f.type==='x'){const k=f.t/0.5;c.strokeStyle='rgba(255,60,60,'+(1-k*0.5)+')';c.lineWidth=12;c.lineCap='round';const r=30+k*10;
      c.beginPath();c.moveTo(x-r,y-r);c.lineTo(x+r,y+r);c.moveTo(x+r,y-r);c.lineTo(x-r,y+r);c.stroke();}
  }
}
function bpDraw(){
  c.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  if(BP.shake>0)c.translate((Math.random()-0.5)*14*BP.shake,(Math.random()-0.5)*10*BP.shake);
  c.fillStyle='#000';c.fillRect(-20,-20,VW+40,VH+40);
  drawSky();drawGround();
  for(const b of BP.blocks){const T=THEMES[b.ti];for(const p of b.items)drawProp(p,T,'back');}
  drawPops();
  for(const b of BP.blocks){const T=THEMES[b.ti];for(const p of b.items)drawProp(p,T,'front');}
  drawFx();
  if(BP.flash>0){c.fillStyle='rgba('+BP.flashCol+','+(BP.flash*0.35)+')';c.fillRect(-20,-20,VW+40,VH+40);}
}
function bpFrame(t){BP.raf=requestAnimationFrame(bpFrame);const dt=Math.min(0.05,(t-BP.last)/1000||0);BP.last=t;
  if(BP.state!=='paused')bpUpdate(BP.state==='intro'||BP.state==='over'?dt*0.6:dt);
  if(BP.state==='intro'||BP.state==='over'){BP.scroll+=speed()*dt*0.4;ensureWorld();}
  bpDraw();}
function bpStart(){if(!BP.raf){BP.last=performance.now();BP.raf=requestAnimationFrame(bpFrame);}}
function bpStop(){if(BP.raf){cancelAnimationFrame(BP.raf);BP.raf=0;}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&APP.mode==='boo'&&BP.state==='play')bpPauseGame();});
addEventListener('keydown',e=>{if(APP.mode==='boo'&&(e.code==='Escape'||e.code==='KeyP')){if(BP.state==='play')bpPauseGame();}});
fillArt();bootDone();

}
})();}
</script>
